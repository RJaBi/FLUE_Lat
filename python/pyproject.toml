[build-system]
build-backend = "mesonpy"
requires = [
    "meson-python>=0.15.0",
    "numpy",
    "fpm; platform_system!='Windows'",
    "ninja; platform_system!='Windows'", 
    "wheel"
]

[tool.black]
line-length = 79
target-version = ["py310"]


[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*"]
skip = ["*-win32"]


[project]
name = "FLUE"
version = "0.1.3"
authors = [{name = "Ryan Bignell", email = "ryan07bignell+github@gmail.com"}]
license = {text = "MIT License"}
readme = "README.md"
description = "Gaugefield operations for lattice QCD"
keywords = ["Fortran", "lattice-qcd",]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering",
]


urls = {Homepage = "https://rjabi.github.io/FLUE_Lat/"}
dependencies = [
    'numpy',
]
